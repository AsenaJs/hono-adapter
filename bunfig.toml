[test]

coverage = true

coverageSkipTestFiles = true

coveragePathIgnorePatterns = [
  "lib/defaults/*.ts",
  "test/utils/*.ts",
  "dist/**/*.js",
  "dist/**/*.ts",
  "../**/*.ts",
  "../**/*.js",
]


[test.reporter]
junit = "junit.xml"

[fmt]
printWidth = 120
tabWidth = 2
useTabs = false
semi = true
singleQuote = true
quoteProps = "as-needed"
jsxSingleQuote = false
trailingComma = "all"
bracketSpacing = true
arrowParens = "always"
proseWrap = "preserve"
htmlWhitespaceSensitivity = "css"
vueIndentScriptAndStyle = false
endOfLine = "lf"
embeddedLanguageFormatting = "auto"
requirePragma = false
insertPragma = false
ignorePatterns = [
  ".changeset/",
  ".claude/",
  ".cursor/",
  ".github/",
  "*.log",
  "bun.lockb",
  "package-lock.json",
  "yarn.lock",
  "pnpm-lock.yaml",
  "*.md",
]
